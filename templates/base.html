{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="TSO Foundation empowers children and young people through education, sports, leadership and community support programmes." />
    <meta name="theme-color" content="#0F4C81" />
    <meta property="og:title" content="TSO Foundation" />
    <meta property="og:description" content="Building stronger communities through education, sports and youth development." />
    <meta property="twitter:card" content="summary_large_image" />
    <title>{% block title %}TSO Foundation{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
    <link rel="stylesheet" href="{% static 'css/pages.css' %}" />
    {% block extra_head %}{% endblock %}
  </head>
  <body>
    {% include 'includes/header.html' %}

    <main>{% block content %}{% endblock %}</main>

    {% include 'includes/footer.html' %}
    <script src="{% static 'js/main.js' %}"></script>
  </body>
</html>
