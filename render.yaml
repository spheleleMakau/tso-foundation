services:
  - type: web
    name: tso-foundation
    env: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "gunicorn tso_foundation.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: tso-foundation.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://tso-foundation.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: tso-foundation-db
          property: connectionString

databases:
  - name: tso-foundation-db
    plan: free
